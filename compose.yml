services:
  web-app:
    build: ./backend 
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database-service 
      - DB_USER=root
      - DB_PASSWORD=my-super-secret-password
      - DB_NAME=os_db
    depends_on:
      - database-service 
  database-service:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=my-super-secret-password
      - MYSQL_DATABASE=os_db
    volumes:
      - db_data:/var/lib/mysql 

volumes:
  db_data: